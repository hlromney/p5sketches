<!DOCTYPE html>
<html lang="en">
  <head>
    <script <script src="https://cdn.jsdelivr.net/npm/p5@2.3.0/lib/p5.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
 <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      main {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* Ensure p5 DOM elements show up correctly */
      button {
        font-family: sans-serif;
        position: absolute;
        z-index: 1000;
        top: 20px;
        left: 20px;
        background-color: #F1EBCA;
        color: #2e2e2e;
        font-size: 12px;
        padding: 6px 10px;
        border: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
     <main id="sketch-holder"></main>
    <script src="sketch.js"></script>
  </body>
</html>
